# The AI agent: picks up one customer request at a time from the portal, makes the change,
# checks it (agent/validate.mjs), publishes, and replies. Triggered by the portal the moment
# a request comes in, with a scheduled sweep as backup.
name: agent
on:
  repository_dispatch:
    types: [ticket]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      ticket:
        description: Request number (blank = oldest open)
        required: false
concurrency:
  group: agent # one request at a time: no git races
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORTAL_URL: ${{ vars.PORTAL_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Safety rules still pass
        run: node --test agent/validate.test.mjs
      - name: Pick a request
        id: pick
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
        run: node agent/run.mjs pick "${{ github.event.client_payload.ticketId || inputs.ticket }}"
      # Claude Code is the harness; the model behind it is DeepSeek V4 Pro on Fireworks (Anthropic-compatible
      # API) when FIREWORKS_API_KEY is set, otherwise Claude Sonnet 5.
      - name: Make the change (Claude Code, file tools only)
        if: steps.pick.outputs.ticket != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          MODEL=claude-sonnet-5
          if [ -n "$FIREWORKS_API_KEY" ]; then
            MODEL=accounts/fireworks/models/deepseek-v4-pro
            unset ANTHROPIC_API_KEY
            export ANTHROPIC_BASE_URL=https://api.fireworks.ai/inference ANTHROPIC_AUTH_TOKEN="$FIREWORKS_API_KEY"
            export ANTHROPIC_DEFAULT_OPUS_MODEL=$MODEL ANTHROPIC_DEFAULT_SONNET_MODEL=$MODEL ANTHROPIC_DEFAULT_HAIKU_MODEL=$MODEL CLAUDE_CODE_SUBAGENT_MODEL=$MODEL
            export CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
          fi
          echo "Model: $MODEL"
          claude -p "$(cat agent/prompt.md)" \
            --model "$MODEL" \
            --max-turns 60 \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" "Bash(git log:*)" "Bash(git show:*)" \
            < /dev/null || true
      # The AI could have written anywhere in this checkout (agent/run.mjs, .git/config, ...), and the
      # next step holds the Render key. So keep only its site folder and .work/, and publish from a
      # fresh checkout: nothing else the AI touched ever runs.
      - name: Keep only the site folder and reply
        if: steps.pick.outputs.ticket != ''
        env:
          SLUG: ${{ steps.pick.outputs.slug }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp -R .work "$RUNNER_TEMP/out/work"
          cp -R "sites/$SLUG" "$RUNNER_TEMP/out/site"
          find "$RUNNER_TEMP/out" -name .git -prune -exec rm -rf {} +
          cd "$RUNNER_TEMP" && rm -rf "$GITHUB_WORKSPACE" && mkdir "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        if: steps.pick.outputs.ticket != ''
      - name: Check, publish, reply
        if: steps.pick.outputs.ticket != ''
        env:
          SLUG: ${{ steps.pick.outputs.slug }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          PUSH: "1"
        run: |
          rm -rf .work "sites/$SLUG"
          cp -R "$RUNNER_TEMP/out/work" .work
          cp -R "$RUNNER_TEMP/out/site" "sites/$SLUG"
          node agent/run.mjs finish
