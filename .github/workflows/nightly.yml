# Once a day: tell the portal to sync domains, renew at T-30, send reminders, and finish transfers.
name: nightly
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Portal nightly job
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PORTAL_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Not configured yet."; exit 0; fi
          curl -fsS --max-time 280 -H "Authorization: Bearer $CRON_SECRET" "$PORTAL_URL/api/cron/nightly"
